server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The page must never be able to phone home with a secret: no outbound
    # connections, no framing, no referrers.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    types { application/wasm wasm; }

    gzip on;
    gzip_types text/css application/javascript application/wasm text/html;
    gzip_min_length 1024;

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location /pkg/ {
        # Immutable build output; the filename changes with every release.
        add_header Cache-Control "public, max-age=604800" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
