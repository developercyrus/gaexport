
services:
  gaexport:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: gaexport
    restart: unless-stopped

    ports:
      - "127.0.0.1:8765:8765"

    environment:
      GAEXPORT_TOKEN: "${GAEXPORT_TOKEN:?Set GAEXPORT_TOKEN in .env}"

    command:
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "8765"
      - --allow-remote
      - --idle-timeout
      - "0"

    read_only: true
    tmpfs:
      - /tmp

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    init: true
